```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Assignment | EduCloud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>EduCloud</h1>
            <div>
                <a href="/">Home</a>
                <a href="/assignments">Assignments</a>
                <a href="/submit">Submit Work</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>Submit Your Assignment</h2>
            <p>Enter your details to submit an assignment request.</p>

            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}

            <form method="POST" action="/submit">
                <label for="student_name">Student Name</label>
                <input type="text" id="student_name" name="student_name"
                       placeholder="Enter your full name" required>

                <label for="assignment_id">Select Assignment</label>
                <select id="assignment_id" name="assignment_id" required>
                    <option value="">Choose an assignment</option>
                    {% for assignment in assignments %}
                    <option value="{{ assignment.id }}">
                        {{ assignment.title }}
                    </option>
                    {% endfor %}
                </select>

                <button class="button" type="submit">Submit Assignment</button>
            </form>
        </section>
    </main>

    <footer>© 2026 EduCloud | Cloud DevOps Capstone Project</footer>
</body>
</html>
```
