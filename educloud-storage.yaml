
AWSTemplateFormatVersion: '2010-09-09'
Description: EduCloud Infrastructure as Code - Secure S3 Storage

Resources:
  EduCloudStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'educloud-iac-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  BucketName:
    Description: EduCloud storage bucket name
    Value: !Ref EduCloudStorageBucket
