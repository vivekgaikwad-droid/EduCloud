AWSTemplateFormatVersion: '2010-09-09'
Description: Private EduCloud S3 bucket for infrastructure objects and student PDF submissions
Resources:
  EduCloudStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: educloud-iac-945528532356-ap-southeast-2
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
Outputs:
  BucketName:
    Value: !Ref EduCloudStorageBucket
